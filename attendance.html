<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #1a2744;
        --secondary: #a8c4d4;
        --card-bg: #ffffff;
        --stroke2: #d0dbe6;
        --tertiary: #1e3a5f;
        --text-primary: #1a2744;
        --text-secondary: #5a6a7a;
        --text-tertiary: #8a9aaa;
        --late-bg: #f0f4c3;
        --late-text: #827717;
        --absent-bg: #fdecea;
        --absent-text: #c62828;
        --present-bg: #e8f5e9;
        --present-text: #2e7d32;
        --halfday-bg: #fff3e0;
        --halfday-text: #e65100;
        --bg: #f0f4f8;
        --sidebar-w: 260px;

        /* Status card colors */
        --clr-present: #2e7d32;
        --clr-present-light: #e8f5e9;
        --clr-present-mid: #a5d6a7;
        --clr-absent: #c62828;
        --clr-absent-light: #fdecea;
        --clr-halfday: #e65100;
        --clr-halfday-light: #fff3e0;
        --clr-late: #f57f17;
        --clr-late-light: #fffde7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 99;
      }
      .sidebar-overlay.active {
        display: block;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        min-height: 100vh;
        background: var(--primary);
        display: flex;
        flex-direction: column;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        box-shadow: 4px 0 24px rgba(26, 39, 68, 0.15);
        transition: transform 0.3s ease;
        overflow-y: auto;
      }
      .sidebar-logo {
        padding: 24px 20px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        flex-shrink: 0;
      }
      .sidebar-logo h2 {
        color: #fff;
        font-size: 22px;
        font-weight: 700;
      }
      .sidebar-logo p {
        color: var(--secondary);
        font-size: 12px;
        margin-top: 2px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .sidebar-section {
        padding: 18px 18px 6px;
      }
      .sidebar-section-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: rgba(168, 196, 212, 0.6);
        margin-bottom: 10px;
      }
      .filter-group {
        margin-bottom: 14px;
      }
      .filter-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--secondary);
        margin-bottom: 5px;
      }
      .filter-select,
      .filter-input {
        width: 100%;
        padding: 8px 11px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(168, 196, 212, 0.2);
        border-radius: 8px;
        color: #fff;
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        outline: none;
        transition: border-color 0.2s;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }
      .filter-select:focus,
      .filter-input:focus {
        border-color: var(--secondary);
        background: rgba(255, 255, 255, 0.12);
      }
      .filter-select option {
        background: var(--primary);
        color: #fff;
      }
      .select-wrapper {
        position: relative;
      }
      .select-wrapper::after {
        content: "▾";
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--secondary);
        pointer-events: none;
        font-size: 12px;
      }
      .clear-btn {
        width: 100%;
        padding: 9px;
        background: transparent;
        color: rgba(168, 196, 212, 0.7);
        border: 1px solid rgba(168, 196, 212, 0.2);
        border-radius: 8px;
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 6px;
      }
      .clear-btn:hover {
        border-color: var(--secondary);
        color: var(--secondary);
      }
      .sidebar-footer {
        margin-top: auto;
        padding: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      .last-refresh {
        font-size: 10px;
        color: rgba(168, 196, 212, 0.5);
        text-align: center;
        line-height: 1.6;
        white-space: pre-line;
      }
      .refresh-btn {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(168, 196, 212, 0.15);
        border-radius: 8px;
        color: var(--secondary);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .refresh-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      /* SUMMARY TOGGLE */
      .summary-toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(168, 196, 212, 0.2);
        border-radius: 8px;
        padding: 9px 11px;
        margin-bottom: 14px;
      }
      .summary-toggle-label {
        font-size: 12px;
        font-weight: 600;
        color: #fff;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 21px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 21px;
        transition: 0.2s;
      }
      .switch-slider::before {
        position: absolute;
        content: "";
        height: 15px;
        width: 15px;
        left: 3px;
        bottom: 3px;
        background-color: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      .switch input:checked + .switch-slider {
        background-color: #4caf50;
      }
      .switch input:checked + .switch-slider::before {
        transform: translateX(17px);
      }

      /* MAIN */
      .main {
        margin-left: var(--sidebar-w);
        flex: 1;
        padding: 28px;
        min-height: 100vh;
      }
      .page-header {
        margin-bottom: 18px;
      }
      .page-header h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: -0.5px;
      }
      .page-header p {
        color: var(--text-secondary);
        font-size: 13px;
        margin-top: 3px;
      }
      #active-filter-label {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 12px;
        background: var(--primary);
        color: var(--secondary);
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }

      /* ── COMPACT STAT CARDS ── */
      .cards-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 12px 14px;
        border: 1px solid var(--stroke2);
        box-shadow: 0 2px 8px rgba(26, 39, 68, 0.06);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 4px;
        border-radius: 12px 0 0 12px;
      }
      .stat-card.present::before {
        background: #4caf50;
      }
      .stat-card.absent::before {
        background: #f44336;
      }
      .stat-card.halfday::before {
        background: #ff9800;
      }
      .stat-card.late::before {
        background: #cddc39;
      }

      .stat-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .stat-card.present .stat-icon {
        background: var(--present-bg);
      }
      .stat-card.absent .stat-icon {
        background: var(--absent-bg);
      }
      .stat-card.halfday .stat-icon {
        background: var(--halfday-bg);
      }
      .stat-card.late .stat-icon {
        background: var(--late-bg);
      }

      .stat-info {
        min-width: 0;
        flex: 1;
      }
      .stat-value {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1;
        font-family: "DM Mono", monospace;
      }
      .stat-card.present .stat-value {
        color: var(--present-text);
      }
      .stat-card.absent .stat-value {
        color: var(--absent-text);
      }
      .stat-card.halfday .stat-value {
        color: var(--halfday-text);
      }
      .stat-card.late .stat-value {
        color: var(--late-text);
      }
      .stat-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .stat-sub {
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── EMPLOYEE CARDS ── */
      .cards-section {
        background: var(--card-bg);
        border-radius: 14px;
        border: 1px solid var(--stroke2);
        box-shadow: 0 2px 12px rgba(26, 39, 68, 0.06);
        overflow: hidden;
      }
      .cards-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--stroke2);
        flex-wrap: wrap;
        gap: 8px;
      }
      .cards-section-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
      }
      .cards-section-count {
        font-size: 12px;
        color: var(--text-secondary);
        background: var(--bg);
        padding: 4px 12px;
        border-radius: 20px;
        font-weight: 500;
      }
      .emp-cards-list {
        padding: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 12px;
      }

      /* Single employee card */
      .emp-card {
        border-radius: 12px;
        padding: 14px 16px;
        position: relative;
        overflow: hidden;
        border: 1.5px solid transparent;
      }
      .emp-card.status-P {
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        border-color: #a5d6a7;
      }
      .emp-card.status-HD {
        background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        border-color: #ffcc80;
      }
      .emp-card.status-other {
        background: linear-gradient(135deg, #fdecea 0%, #ffcdd2 100%);
        border-color: #ef9a9a;
      }

      .emp-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .emp-card-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1.2;
      }
      .emp-card-id {
        font-size: 11px;
        color: var(--text-secondary);
        font-family: "DM Mono", monospace;
        margin-top: 2px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
        margin-left: 8px;
      }
      .status-pill.P {
        background: #2e7d32;
        color: #fff;
      }
      .status-pill.HD {
        background: #e65100;
        color: #fff;
      }
      .status-pill.other {
        background: #888;
        color: #fff;
      }

      .emp-card-times {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .time-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.65);
        border-radius: 8px;
        padding: 7px 12px;
        flex: 1;
        min-width: 130px;
      }
      .time-chip-icon {
        font-size: 14px;
      }
      .time-chip-label {
        font-size: 10px;
        color: var(--text-secondary);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .time-chip-val {
        font-size: 14px;
        font-family: "DM Mono", monospace;
        font-weight: 600;
        color: var(--primary);
        display: block;
      }
      .time-chip-val.not-yet {
        color: var(--text-tertiary);
        font-style: italic;
        font-size: 12px;
      }

      .emp-card-footer {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
      }
      .date-tag {
        font-size: 11px;
        font-family: "DM Mono", monospace;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.6);
        padding: 3px 8px;
        border-radius: 6px;
      }
      .late-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 160, 0, 0.15);
        border: 1px solid rgba(255, 160, 0, 0.4);
        color: #e65100;
        border-radius: 8px;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 600;
        font-family: "DM Mono", monospace;
      }
      .on-time-chip {
        font-size: 11px;
        color: #388e3c;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }

      /* LOADING / EMPTY */
      .loading-state,
      .empty-state {
        padding: 50px 24px;
        text-align: center;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid var(--stroke2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 14px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-state p,
      .empty-state p {
        color: var(--text-secondary);
        font-size: 14px;
      }
      .empty-icon {
        font-size: 36px;
        margin-bottom: 10px;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--stroke2);
        border-radius: 3px;
      }

      .topbar {
        display: none;
        align-items: center;
        justify-content: space-between;
        background: #1a2744;
        padding: 14px 16px;
        position: sticky;
        top: 0;
        z-index: 200;
      }

      .topbar-title {
        font-size: 16px;
        font-weight: 700;
        color: #fff;
      }

      .menu-btn {
        font-size: 20px;
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
      }

      .emp-cards-list.summary-mode {
        display: block;
        padding: 0;
      }

      /* SUMMARY TABLE */
      .summary-table-wrap {
        overflow-x: auto;
        padding: 4px;
      }
      table.summary-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 640px;
      }
      table.summary-table th:nth-child(1),
      table.summary-table td:nth-child(1) {
        width: 34%;
      }
      table.summary-table th:nth-child(2),
      table.summary-table td:nth-child(2),
      table.summary-table th:nth-child(3),
      table.summary-table td:nth-child(3),
      table.summary-table th:nth-child(4),
      table.summary-table td:nth-child(4) {
        width: 14%;
      }
      table.summary-table th:nth-child(5),
      table.summary-table td:nth-child(5) {
        width: 24%;
      }
      table.summary-table thead th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        background: var(--bg);
        padding: 10px 14px;
        position: sticky;
        top: 0;
      }
      table.summary-table thead th.num {
        text-align: center;
      }
      table.summary-table thead th.sortable {
        cursor: pointer;
        user-select: none;
        transition: color 0.15s;
      }
      table.summary-table thead th.sortable:hover {
        color: var(--primary);
      }
      table.summary-table tbody td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--stroke2);
        font-family: "DM Mono", monospace;
        font-size: 13px;
      }
      table.summary-table tbody td.name-cell {
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        color: var(--primary);
      }
      table.summary-table tbody td.num {
        text-align: center;
        font-weight: 600;
      }
      table.summary-table tbody tr:hover td {
        background: rgba(26, 39, 68, 0.03);
      }
      td.num.present-col {
        color: var(--present-text);
      }
      td.num.absent-col {
        color: var(--absent-text);
      }
      td.num.halfday-col {
        color: var(--halfday-text);
      }
      td.num.late-col {
        color: var(--late-text);
      }

      /* RESPONSIVE */
      @media (max-width: 1100px) {
        .cards-row {
          grid-template-columns: repeat(2, 1fr);
        }
        .topbar {
          display: flex;
        }
      }
      @media (max-width: 768px) {
        body {
          display: block; /* 🔥 important */
        }
        .main {
          margin-left: 0;
          padding: 20px 16px 20px; /* 🔥 FIX */
          transition: transform 0.3s ease;
        }
        .sidebar {
          transform: translateX(-100%);
          top: 55px; /* topbar height */
          height: calc(100vh - 55px);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .sidebar.open ~ .main {
          transform: translateX(260px);
        }

        .page-header {
          margin-top: 10px;
        }
        .page-header h1 {
          font-size: 18px;
        }
        .cards-row {
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
        }
        .stat-value {
          font-size: 18px;
        }
        .stat-icon {
          width: 30px;
          height: 30px;
          font-size: 14px;
        }
        .emp-cards-list {
          grid-template-columns: 1fr;
          padding: 10px;
          gap: 10px;
        }
        .emp-card-name {
          font-size: 13px;
        }
        .time-chip {
          min-width: 100px;
          padding: 5px 8px;
        }
        .time-chip-val {
          font-size: 12px;
        }
      }
      @media (max-width: 400px) {
        .stat-value {
          font-size: 15px;
        }
        .stat-sub {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="topbar-title">Attendance Dashboard</span>
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="summary-toggle-row">
          <span class="summary-toggle-label">📊 Summary View</span>
          <label class="switch">
            <input type="checkbox" id="summary-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="filter-group" id="emp-filter-group">
          <label class="filter-label">Employee</label>
          <div class="select-wrapper">
            <select class="filter-select" id="emp-filter">
              <option value="">All Employees</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label class="filter-label">Year</label>
          <div class="select-wrapper">
            <select class="filter-select" id="year-filter">
              <option value="">All Years</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label class="filter-label">Month</label>
          <div class="select-wrapper">
            <select class="filter-select" id="month-filter">
              <option value="">All Months</option>
              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>
        </div>
        <div class="filter-group" id="date-filter-group">
          <label class="filter-label">Specific Date</label>
          <input type="date" class="filter-input" id="date-filter" />
        </div>
        <button class="clear-btn" id="clear-btn">✕ Clear Filters</button>
      </div>
      <div class="sidebar-footer">
        <div class="last-refresh" id="last-refresh">Loading...</div>
        <button class="refresh-btn" id="refresh-btn">↻ Refresh Data</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <span id="active-filter-label">Today</span>
      </div>

      <!-- 2x2 COMPACT STATS -->
      <div class="cards-row" id="stats-row">
        <div class="stat-card present">
          <div class="stat-icon">✅</div>
          <div class="stat-info">
            <div class="stat-value" id="count-present">—</div>
            <div class="stat-label">Present</div>
            <div class="stat-sub" id="sub-present">Loading...</div>
          </div>
        </div>
        <div class="stat-card absent">
          <div class="stat-icon">❌</div>
          <div class="stat-info">
            <div class="stat-value" id="count-absent">—</div>
            <div class="stat-label">Absent</div>
            <div class="stat-sub" id="sub-absent">Loading...</div>
          </div>
        </div>
        <div class="stat-card halfday">
          <div class="stat-icon">🌗</div>
          <div class="stat-info">
            <div class="stat-value" id="count-halfday">—</div>
            <div class="stat-label">Half Day</div>
            <div class="stat-sub" id="sub-halfday">Loading...</div>
          </div>
        </div>
        <div class="stat-card late">
          <div class="stat-icon">⏰</div>
          <div class="stat-info">
            <div class="stat-value" id="count-late">—</div>
            <div class="stat-label">Late Time</div>
            <div class="stat-sub" id="sub-late">Loading...</div>
          </div>
        </div>
      </div>

      <!-- EMPLOYEE CARDS / SUMMARY -->
      <div class="cards-section">
        <div class="cards-section-header">
          <div class="cards-section-title" id="section-title">
            Attendance Log
          </div>
          <div class="cards-section-count" id="row-count">Loading...</div>
        </div>
        <div class="emp-cards-list" id="emp-cards-list">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Fetching attendance data...</p>
          </div>
        </div>
      </div>
    </main>

    <script>
      const SHEET_ID = "1FoAHnlhikIn-d2xFGwaOu982J0RYhjEtih3NrNix8t8";
      const ATTENDANCE_SHEET = "Final_Attendance";
      const USERS_SHEET = "Users";

      const HOLIDAYS = new Set([
        "2026-01-14",
        "2026-01-26",
        "2026-03-04",
        "2026-08-28",
        "2026-09-14",
        "2026-10-02",
        "2026-10-20",
        "2026-11-10",
        "2026-11-11",
        "2026-12-25",
      ]);

      let allAttendance = [],
        allUsers = [];

      function toISO(d) {
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function isWorkingDay(d) {
        if (!d) return false;
        const day = d.getDay();
        if (day === 0 || day === 6) return false;
        return !HOLIDAYS.has(toISO(d));
      }
      function workingDaysBetween(from, to) {
        const days = [],
          cur = new Date(from);
        cur.setHours(0, 0, 0, 0);
        const end = new Date(to);
        end.setHours(23, 59, 59, 999);
        while (cur <= end) {
          if (isWorkingDay(cur)) days.push(toISO(new Date(cur)));
          cur.setDate(cur.getDate() + 1);
        }
        return days;
      }
      function parseDate(raw) {
        if (!raw) return null;
        if (typeof raw === "string" && raw.startsWith("Date(")) {
          const p = raw.slice(5, -1).split(",").map(Number);
          return new Date(p[0], p[1], p[2]);
        }
        if (typeof raw === "string") {
          const dmy = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
          if (dmy) {
            const yr =
              dmy[3].length === 2 ? 2000 + parseInt(dmy[3]) : parseInt(dmy[3]);
            return new Date(yr, parseInt(dmy[2]) - 1, parseInt(dmy[1]));
          }
          const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (iso)
            return new Date(
              parseInt(iso[1]),
              parseInt(iso[2]) - 1,
              parseInt(iso[3]),
            );
          const d = new Date(raw);
          if (!isNaN(d.getTime())) return d;
        }
        if (typeof raw === "number")
          return new Date(Math.round((raw - 25569) * 86400 * 1000));
        return null;
      }
      function fmtDate(d) {
        if (!d) return "—";
        return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(-2)}`;
      }
      function parseTime(cell) {
        const fmt =
          cell && typeof cell === "object" ? String(cell.f || "").trim() : "";
        if (fmt && fmt !== "-") return fmt;
        const raw = cell && typeof cell === "object" ? cell.v : cell;
        if (!raw && raw !== 0) return "—";
        if (typeof raw === "number") {
          const sec = Math.round(raw * 86400),
            h = Math.floor(sec / 3600),
            m = Math.floor((sec % 3600) / 60),
            s = sec % 60;
          const ap = h >= 12 ? "PM" : "AM",
            hh = h % 12 === 0 ? 12 : h % 12;
          return `${pad(hh)}:${pad(m)}:${pad(s)} ${ap}`;
        }
        const str = String(raw).trim();
        return str === "" || str === "-" ? "—" : str;
      }
      function parseLateToSec(cell) {
        const formatted =
          cell && typeof cell === "object"
            ? String(cell.f || "").trim()
            : String(cell || "").trim();
        if (
          formatted &&
          formatted !== "-" &&
          formatted !== "0:00:00" &&
          formatted !== "00:00:00"
        ) {
          const p = formatted.split(":").map(Number);
          if (p.length >= 2 && !p.some(isNaN)) {
            const sec = (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0);
            if (sec > 0) return sec;
          }
        }
        const raw = cell && typeof cell === "object" ? cell.v : cell;
        if (!raw && raw !== 0) return 0;
        if (typeof raw === "number")
          return Math.max(0, Math.round(raw * 86400));
        const str = String(raw).trim();
        if (!str || str === "-" || str === "00:00:00") return 0;
        const p = str.split(":").map(Number);
        return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0);
      }
      function secToHMS(sec) {
        const h = Math.floor(sec / 3600),
          m = Math.floor((sec % 3600) / 60),
          s = sec % 60;
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }

      async function fetchSheet(name) {
        const res = await fetch(
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`,
        );
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        return json.table.rows.map((row) =>
          row.c.map((cell) =>
            cell ? { v: cell.v ?? "", f: cell.f ?? "" } : { v: "", f: "" },
          ),
        );
      }
      function cv(c) {
        return c && typeof c === "object" ? c.v : c;
      }

      async function loadData() {
        document.getElementById("emp-cards-list").innerHTML =
          '<div class="loading-state"><div class="spinner"></div><p>Fetching data...</p></div>';
        try {
          const [attRows, userRows] = await Promise.all([
            fetchSheet(ATTENDANCE_SHEET),
            fetchSheet(USERS_SHEET),
          ]);
          allUsers = userRows
            .slice(1)
            .map((r) => ({
              id: String(cv(r[0]) || "").trim(),
              name: String(cv(r[2]) || "").trim(),
            }))
            .filter((u) => u.id && u.name);
          allAttendance = attRows
            .slice(1)
            .map((r) => {
              const dateObj = parseDate(cv(r[1]));
              const lateSec = parseLateToSec(r[10]);
              return {
                empId: String(cv(r[0]) || "").trim(),
                dateObj,
                dateStr: fmtDate(dateObj),
                isoDate: dateObj ? toISO(dateObj) : "",
                yy: dateObj ? String(dateObj.getFullYear()).slice(-2) : null,
                mm: dateObj ? pad(dateObj.getMonth() + 1) : null,
                punchIn: parseTime(r[2]),
                punchOut: parseTime(r[3]),
                empName: String(cv(r[5]) || "").trim(),
                status: String(cv(r[8]) || "")
                  .trim()
                  .toUpperCase(),
                lateSec,
                lateStr: lateSec > 0 ? secToHMS(lateSec) : "—",
              };
            })
            .filter((r) => r.empId && r.dateObj);

          const empSel = document.getElementById("emp-filter");
          empSel.innerHTML = '<option value="">All Employees</option>';
          [...new Set(allAttendance.map((r) => r.empName))]
            .sort()
            .forEach((n) => {
              const o = document.createElement("option");
              o.value = n;
              o.textContent = n;
              empSel.appendChild(o);
            });

          const yearSel = document.getElementById("year-filter");
          yearSel.innerHTML = '<option value="">All Years</option>';
          [...new Set(allAttendance.map((r) => r.yy).filter(Boolean))]
            .sort()
            .forEach((y) => {
              const o = document.createElement("option");
              o.value = y;
              o.textContent = "20" + y;
              yearSel.appendChild(o);
            });

          document.getElementById("last-refresh").textContent =
            `Last refreshed\n${new Date().toLocaleTimeString()}`;
          applyFilters();
        } catch (e) {
          console.error(e);
          document.getElementById("emp-cards-list").innerHTML =
            `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Error loading data.</p><p style="font-size:11px;margin-top:6px;color:#aaa">${e.message}</p></div>`;
        }
      }

      function calcAbsent(emp, date, year, month) {
        const today = new Date();
        today.setHours(23, 59, 59, 999);
        const empList = emp
          ? allUsers.filter((u) => u.name === emp).map((u) => u.id)
          : allUsers.map((u) => u.id);
        let from, to;
        if (date) {
          from = to = new Date(date + "T00:00:00");
        } else if (year && month) {
          const yr = 2000 + parseInt(year),
            mo = parseInt(month) - 1;
          from = new Date(yr, mo, 1);
          to = new Date(yr, mo + 1, 0);
        } else if (month) {
          const yrs = [
            ...new Set(
              allAttendance
                .filter((r) => r.mm === month)
                .map((r) => r.dateObj.getFullYear()),
            ),
          ];
          if (!yrs.length) return { count: 0, sub: "No data" };
          const yr = Math.max(...yrs);
          from = new Date(yr, parseInt(month) - 1, 1);
          to = new Date(yr, parseInt(month), 0);
        } else if (year) {
          const yr = 2000 + parseInt(year);
          from = new Date(yr, 0, 1);
          to = new Date(yr, 11, 31);
        } else {
          const dates = allAttendance.map((r) => r.dateObj).filter(Boolean);
          if (!dates.length) return { count: 0, sub: "No data" };
          from = new Date(Math.min(...dates));
          to = new Date(Math.min(Math.max(...dates), today));
        }
        if (to > today) to = new Date(today);
        const wdays = workingDaysBetween(from, to);
        if (!wdays.length) return { count: 0, sub: "0 working days" };
        const presentSet = new Set(
          allAttendance
            .map((r) => (r.isoDate ? `${r.empId}__${r.isoDate}` : null))
            .filter(Boolean),
        );
        let absent = 0;
        for (const id of empList)
          for (const d of wdays) if (!presentSet.has(`${id}__${d}`)) absent++;
        return { count: absent, sub: `${wdays.length} working day(s)` };
      }
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
        document.getElementById("sidebar-overlay").classList.toggle("active");
      }

      function isSummaryMode() {
        return document.getElementById("summary-toggle").checked;
      }

      let summarySortKey = "name";
      let summarySortDir = 1; // 1 asc, -1 desc
      let lastSummaryList = [];

      function renderSummaryTable() {
        const container = document.getElementById("emp-cards-list");
        container.classList.add("summary-mode");
        const list = [...lastSummaryList].sort((a, b) => {
          let av = a[summarySortKey],
            bv = b[summarySortKey];
          if (typeof av === "string") {
            return summarySortDir * av.localeCompare(bv);
          }
          return summarySortDir * (av - bv);
        });

        const arrow = (key) =>
          summarySortKey === key ? (summarySortDir === 1 ? " ▲" : " ▼") : "";

        container.innerHTML = `
          <div class="summary-table-wrap">
            <table class="summary-table">
              <thead>
                <tr>
                  <th class="sortable" data-sort="name">Employee${arrow("name")}</th>
                  <th class="num sortable" data-sort="present">Present${arrow("present")}</th>
                  <th class="num sortable" data-sort="absent">Absent${arrow("absent")}</th>
                  <th class="num sortable" data-sort="halfday">Half Day${arrow("halfday")}</th>
                  <th class="num sortable" data-sort="lateSec">Total Late Time${arrow("lateSec")}</th>
                </tr>
              </thead>
              <tbody>
                ${list
                  .map(
                    (s) => `
                  <tr>
                    <td class="name-cell">${s.name}<br><span style="font-size:10px;color:var(--text-tertiary);font-weight:400;">${s.id}</span></td>
                    <td class="num present-col">${s.present}</td>
                    <td class="num absent-col">${s.absent}</td>
                    <td class="num halfday-col">${s.halfday}</td>
                    <td class="num late-col">${secToHMS(s.lateSec)}</td>
                  </tr>
                `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        container.querySelectorAll("th.sortable").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.getAttribute("data-sort");
            if (summarySortKey === key) {
              summarySortDir *= -1;
            } else {
              summarySortKey = key;
              summarySortDir = 1;
            }
            renderSummaryTable();
          });
        });
      }

      function renderSummaryView() {
        const year = document.getElementById("year-filter").value;
        const month = document.getElementById("month-filter").value;

        // Hide stat cards in summary mode
        document.getElementById("stats-row").style.display = "none";
        document.getElementById("section-title").textContent =
          "Monthly Summary";

        const mNames = [
          "",
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        const labelParts = [];
        if (year) labelParts.push("20" + year);
        if (month) labelParts.push(mNames[parseInt(month)]);
        document.getElementById("active-filter-label").textContent =
          labelParts.length
            ? labelParts.join(" · ") + " Summary"
            : "All Records Summary";

        // Determine working days in range for absent calc
        const today = new Date();
        today.setHours(23, 59, 59, 999);
        let from, to;
        if (year && month) {
          const yr = 2000 + parseInt(year),
            mo = parseInt(month) - 1;
          from = new Date(yr, mo, 1);
          to = new Date(yr, mo + 1, 0);
        } else if (month) {
          const yrs = [
            ...new Set(
              allAttendance
                .filter((r) => r.mm === month)
                .map((r) => r.dateObj.getFullYear()),
            ),
          ];
          const yr = yrs.length ? Math.max(...yrs) : today.getFullYear();
          from = new Date(yr, parseInt(month) - 1, 1);
          to = new Date(yr, parseInt(month), 0);
        } else if (year) {
          const yr = 2000 + parseInt(year);
          from = new Date(yr, 0, 1);
          to = new Date(yr, 11, 31);
        } else {
          const dates = allAttendance.map((r) => r.dateObj).filter(Boolean);
          from = dates.length ? new Date(Math.min(...dates)) : new Date();
          to = new Date();
        }
        if (to > today) to = new Date(today);
        const wdays = workingDaysBetween(from, to);
        const wdaySet = new Set(wdays);

        // Filter attendance rows within range (by year/month select, ignoring emp filter)
        let rows = [...allAttendance];
        if (year) rows = rows.filter((r) => r.yy === year);
        if (month) rows = rows.filter((r) => r.mm === month);
        rows = rows.filter((r) => wdaySet.has(r.isoDate));

        // Build per-employee summary
        const summaryMap = {};
        allUsers.forEach((u) => {
          summaryMap[u.id] = {
            name: u.name,
            id: u.id,
            present: 0,
            halfday: 0,
            absent: 0,
            lateSec: 0,
          };
        });
        rows.forEach((r) => {
          if (!summaryMap[r.empId]) {
            summaryMap[r.empId] = {
              name: r.empName,
              id: r.empId,
              present: 0,
              halfday: 0,
              absent: 0,
              lateSec: 0,
            };
          }
          const s = summaryMap[r.empId];
          if (r.status === "P") s.present++;
          else if (r.status === "HD") s.halfday++;
          s.lateSec += r.lateSec;
        });

        // Absent = working days - (present+halfday marked) per employee
        Object.values(summaryMap).forEach((s) => {
          const marked = s.present + s.halfday;
          s.absent = Math.max(0, wdays.length - marked);
        });

        lastSummaryList = Object.values(summaryMap).filter((s) => s.name);

        document.getElementById("row-count").textContent =
          `${lastSummaryList.length} employee(s)`;

        if (!lastSummaryList.length) {
          const container = document.getElementById("emp-cards-list");
          container.classList.remove("summary-mode");
          container.innerHTML =
            '<div class="empty-state"><div class="empty-icon">🔍</div><p>No data found.</p></div>';
          return;
        }

        renderSummaryTable();
      }

      function applyFilters() {
        if (isSummaryMode()) {
          renderSummaryView();
          return;
        }

        document.getElementById("stats-row").style.display = "";
        document.getElementById("section-title").textContent = "Attendance Log";
        document
          .getElementById("emp-cards-list")
          .classList.remove("summary-mode");

        const emp = document.getElementById("emp-filter").value;
        const year = document.getElementById("year-filter").value;
        const month = document.getElementById("month-filter").value;
        const date = document.getElementById("date-filter").value;

        let filtered = [...allAttendance];
        if (emp) filtered = filtered.filter((r) => r.empName === emp);
        if (year) filtered = filtered.filter((r) => r.yy === year);
        if (month) filtered = filtered.filter((r) => r.mm === month);
        if (date) {
          const d = new Date(date + "T00:00:00");
          filtered = filtered.filter(
            (r) =>
              r.dateObj &&
              r.dateObj.getFullYear() === d.getFullYear() &&
              r.dateObj.getMonth() === d.getMonth() &&
              r.dateObj.getDate() === d.getDate(),
          );
        }

        const presentCount = filtered.filter((r) => r.status === "P").length;
        const halfdayCount = filtered.filter((r) => r.status === "HD").length;
        const totalLateSec = filtered.reduce((a, r) => a + r.lateSec, 0);
        const lateCount = filtered.filter((r) => r.lateSec > 0).length;
        const absent = calcAbsent(emp, date, year, month);

        document.getElementById("count-present").textContent = presentCount;
        document.getElementById("sub-present").textContent =
          `${halfdayCount} half day incl.`;
        document.getElementById("count-absent").textContent = absent.count;
        document.getElementById("sub-absent").textContent = absent.sub;
        document.getElementById("count-halfday").textContent = halfdayCount;
        document.getElementById("sub-halfday").textContent =
          `of ${presentCount + halfdayCount} marked`;
        document.getElementById("count-late").textContent =
          secToHMS(totalLateSec);
        document.getElementById("sub-late").textContent =
          `${lateCount} late arrival(s)`;

        const mNames = [
          "",
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        const parts = [];
        if (emp) parts.push(emp);
        if (year) parts.push("20" + year);
        if (month) parts.push(mNames[parseInt(month)]);
        if (date)
          parts.push(
            new Date(date + "T00:00:00").toLocaleDateString("en-IN", {
              day: "numeric",
              month: "short",
              year: "numeric",
            }),
          );
        document.getElementById("active-filter-label").textContent =
          parts.length ? parts.join(" · ") : "All Records";
        document.getElementById("row-count").textContent =
          `${filtered.length} records`;

        const list = document.getElementById("emp-cards-list");
        if (!filtered.length) {
          list.innerHTML =
            '<div class="empty-state"><div class="empty-icon">🔍</div><p>No records found.</p></div>';
          return;
        }

        list.innerHTML = filtered
          .map((r) => {
            const statusClass =
              r.status === "P"
                ? "status-P"
                : r.status === "HD"
                  ? "status-HD"
                  : "status-other";
            const pillClass =
              r.status === "P" ? "P" : r.status === "HD" ? "HD" : "other";
            const pillLabel =
              r.status === "P"
                ? "✅ Present"
                : r.status === "HD"
                  ? "🌗 Half Day"
                  : r.status || "—";
            const punchOutHtml =
              r.punchOut === "—"
                ? `<span class="time-chip-val not-yet">Not yet</span>`
                : `<span class="time-chip-val">${r.punchOut}</span>`;
            const lateHtml =
              r.lateSec > 0
                ? `<span class="late-chip">⏰ ${r.lateStr} late</span>`
                : `<span class="on-time-chip">✔ On time</span>`;

            return `<div class="emp-card ${statusClass}">
            <div class="emp-card-top">
              <div>
                <div class="emp-card-name">${r.empName}</div>
                <div class="emp-card-id">${r.empId}</div>
              </div>
              <span class="status-pill ${pillClass}">${pillLabel}</span>
            </div>
            <div class="emp-card-times">
              <div class="time-chip">
                <span class="time-chip-icon">🟢</span>
                <div>
                  <div class="time-chip-label">Punch In</div>
                  <span class="time-chip-val">${r.punchIn}</span>
                </div>
              </div>
              <div class="time-chip">
                <span class="time-chip-icon">🔴</span>
                <div>
                  <div class="time-chip-label">Punch Out</div>
                  ${punchOutHtml}
                </div>
              </div>
            </div>
            <div class="emp-card-footer">
              <span class="date-tag">📅 ${r.dateStr}</span>
              ${lateHtml}
            </div>
          </div>`;
          })
          .join("");
      }

      function updateSummaryModeUI() {
        const on = isSummaryMode();
        document.getElementById("emp-filter-group").style.display = on
          ? "none"
          : "";
        document.getElementById("date-filter-group").style.display = on
          ? "none"
          : "";
        if (on) {
          const yearSel = document.getElementById("year-filter");
          const monthSel = document.getElementById("month-filter");
          if (!yearSel.value) {
            const t = new Date();
            const curYY = String(t.getFullYear()).slice(-2);
            if ([...yearSel.options].some((o) => o.value === curYY))
              yearSel.value = curYY;
          }
          if (!monthSel.value) {
            const t = new Date();
            monthSel.value = pad(t.getMonth() + 1);
          }
        }
        applyFilters();
      }

      ["emp-filter", "year-filter", "month-filter", "date-filter"].forEach(
        (id) => {
          document.getElementById(id).addEventListener("change", applyFilters);
        },
      );
      document
        .getElementById("summary-toggle")
        .addEventListener("change", updateSummaryModeUI);
      document.getElementById("clear-btn").addEventListener("click", () => {
        ["emp-filter", "date-filter"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
        if (!isSummaryMode()) {
          document.getElementById("year-filter").value = "";
          document.getElementById("month-filter").value = "";
        }
        applyFilters();
      });
      document
        .getElementById("refresh-btn")
        .addEventListener("click", loadData);

      const sb = document.getElementById("sidebar");
      const ov = document.getElementById("sidebar-overlay");

      ov.addEventListener("click", () => {
        sb.classList.remove("open");
        ov.classList.remove("active");
      });

      (() => {
        const t = new Date();
        document.getElementById("date-filter").value =
          `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
      })();

      loadData();
    </script>
  </body>
</html>
