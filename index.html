<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HR Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* HEADER */
      .header {
        padding: 10px 10px;
        background: #1e293b;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .title {
        font-size: 18px;
        font-weight: 600;
      }

      /* TAB BUTTONS */
      .tabs {
        display: flex;
        gap: 10px;
        background: #f1f5f9;
        padding: 8px;
        border-radius: 12px;
      }

      .tab-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: transparent;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        color: #475569;
      }

      .tab-btn.active {
        background: #2ad146;
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }

      .tab-btn:hover {
        background: #70da37;
      }

      /* IFRAME CONTAINER */
      .content {
        flex: 1;
        position: relative;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
      }

      /* LOADER */
      .loader {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: #2563eb;
        display: none;
      }

      .loader.show {
        display: flex;
      }

      /* MOBILE */
      @media (max-width: 600px) {
        .header {
          flex-direction: column;
          gap: 10px;
        }
        .tabs {
          width: 100%;
          justify-content: space-between;
        }
        .tab-btn {
          flex: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->

    <div class="header">
      <div class="title">BANKBENCHERS ATTENDANCE SYSTEM</div>

      <div class="tabs">
        <button
          class="tab-btn active"
          onclick="loadPage('attendance.html', this)"
        >
          Attendance
        </button>
        <button class="tab-btn" onclick="loadPage('leave.html', this)">
          Leave
        </button>
      </div>
    </div>

    <!-- CONTENT -->

    <div class="content">
      <div class="loader" id="loader">Loading...</div>
      <iframe id="frame" src="attendance.html"></iframe>
    </div>

    <script>
      const frame = document.getElementById("frame");
      const loader = document.getElementById("loader");

      function loadPage(page, btn) {
        // show loader
        loader.classList.add("show");

        // change iframe
        frame.src = page;

        // active button
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      }

      // hide loader when loaded
      frame.onload = () => {
        loader.classList.remove("show");
      };
    </script>
  </body>
</html>
